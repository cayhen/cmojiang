<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- background disc -->
  <circle cx="50" cy="50" r="50" fill="#161616"/>

  <!-- 6 aperture arc blades: 45° sweep, 60° apart, thin -->
  <g transform="translate(50,50)" fill="none" stroke="#c0c0c0"
     stroke-width="6.5" stroke-linecap="round">
    <path d="M 0,-34 A 34 34 0 0 1 24,-24" transform="rotate(0)"/>
    <path d="M 0,-34 A 34 34 0 0 1 24,-24" transform="rotate(60)"/>
    <path d="M 0,-34 A 34 34 0 0 1 24,-24" transform="rotate(120)"/>
    <path d="M 0,-34 A 34 34 0 0 1 24,-24" transform="rotate(180)"/>
    <path d="M 0,-34 A 34 34 0 0 1 24,-24" transform="rotate(240)"/>
    <path d="M 0,-34 A 34 34 0 0 1 24,-24" transform="rotate(300)"/>
  </g>

  <!-- center aperture ring -->
  <circle cx="50" cy="50" r="7" fill="none" stroke="#c0c0c0" stroke-width="5.5"/>
</svg>
